name: Deploy
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      skip_setup_acr_infra:
        description: 'Skip setup-acr-infra job'
        required: false
        default: false
        type: boolean
      skip_setup_infra:
        description: 'Skip setup-infra job'
        required: false
        default: false
        type: boolean
      skip_build_and_push_images:
        description: 'Skip build-and-push-images job'
        required: false
        default: false
        type: boolean
      skip_setup_apps:
        description: 'Skip setup-apps job'
        required: false
        default: false
        type: boolean

jobs:
  setup-acr-infra:
    if: github.event_name == 'push' || github.event.inputs.skip_setup_acr_infra == 'false'
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
            .yarn/build-state.yml
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Run Pulumi Automation API for ACR infra and export outputs
        id: pulumi-acr
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-acr-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          npx ts-node index.ts
          
  setup-infra:
    if: github.event_name == 'push' || github.event.inputs.skip_setup_infra == 'false'
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
            .yarn/build-state.yml
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy

      - name: Run Pulumi Automation API for infra
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          npx ts-node index.ts

  build-and-push-images:
    if: github.event_name == 'push' || github.event.inputs.skip_build_and_push_images == 'false'
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
        include:
          - name: marketing-nginx
            dockerfile: mautic/marketing-nginx.dockerfile
          - name: marketing-mautic-app
            dockerfile: mautic/marketing-mautic-app.dockerfile
          - name: marketing-strapi-app
            dockerfile: launchpad/Dockerfile.prod
          - name: marketing-suitecrm-app
            dockerfile: suitecrm/marketing-suitecrm-app.dockerfile
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ hashFiles(matrix.dockerfile) }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Compute build hash for image
        id: build_hash
        run: |
          DOCKERFILE_PATH="${{ matrix.dockerfile }}"
          CONTEXT_DIR=$(dirname "$DOCKERFILE_PATH")
          HASH=$(find "$CONTEXT_DIR" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "build_hash=$HASH" >> $GITHUB_OUTPUT
      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" \
            -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Login to Azure Container Registry
        run: |
          ORG_PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $1 "/" $2}')
          ACR_STACK_NAME="setup-acr-infra"
          FULL_STACK="$ORG_PROJECT/$ACR_STACK_NAME"
          pulumi stack output acrPasswordOut --show-secrets -s "$FULL_STACK" | \
          docker login \
            "$(pulumi stack output registryUrlOut -s "$FULL_STACK")" \
            -u "$(pulumi stack output acrUsernameOut -s "$FULL_STACK")" \
            --password-stdin

      - name: Build and push Docker image (if not present)
        run: |
          BUILD_HASH=${{ steps.build_hash.outputs.build_hash }}
          ORG_PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $1 "/" $2}')
          ACR_STACK_NAME="setup-acr-infra"
          FULL_STACK="$ORG_PROJECT/$ACR_STACK_NAME"
          acrUrlOut=$(pulumi stack output registryUrlOut -s "$FULL_STACK")
          ACR_NAME=$(echo "$acrUrlOut" | awk -F'.' '{print $1}')
          repo="$acrUrlOut/${{ matrix.name }}"
          # Check if tag exists in ACR
          if az acr repository show-tags --name "$ACR_NAME" --repository "${{ matrix.name }}" --query "[?@=='$BUILD_HASH']" -o tsv | grep -q "$BUILD_HASH"; then
            echo "$repo:$BUILD_HASH already exists in ACR, skipping build and push."
          else
            docker buildx create --use
            docker buildx build \
              --push \
              --cache-from=type=local,src=/tmp/.buildx-cache \
              --cache-to=type=local,dest=/tmp/.buildx-cache \
              -t $repo:$BUILD_HASH \
              -f ${{ matrix.dockerfile }} .
            # Tag and push as latest
            docker tag $repo:$BUILD_HASH $repo:latest
            docker push $repo:latest
          fi
  setup-apps:
    if: github.event_name == 'push' || github.event.inputs.skip_setup_apps == 'false'
    needs: [setup-infra, build-and-push-images]
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
            .yarn/build-state.yml
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy
      
      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" \
            -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Run Pulumi Automation API for apps
        id: pulumi-apps
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-apps
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          npx ts-node index.ts