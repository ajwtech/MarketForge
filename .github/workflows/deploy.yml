name: Deploy
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - master
jobs:
  
  setup-acr-infra:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Enable Corepack (Yarn 4+)
        run: corepack enable
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
            .yarn/build-state.yml
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        run: yarn install --immutable
        working-directory: .
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Run Pulumi Automation API for ACR infra and export outputs
        id: pulumi-acr
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-acr-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          npx ts-node index.ts
          
  setup-infra:
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Enable Corepack (Yarn 4+)
        run: corepack enable
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .yarn/unplugged
            .yarn/build-state.yml
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Run Pulumi Automation API for infra
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          npx ts-node index.ts

  build-images:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    strategy:
      matrix:
        include:
          - name: marketing-nginx
            dockerfile: mautic/marketing-nginx.dockerfile
          - name: marketing-mautic-app
            dockerfile: mautic/marketing-mautic-app.dockerfile
          - name: marketing-strapi-app
            dockerfile: launchpad/Dockerfile.prod
          - name: marketing-suitecrm-app
            dockerfile: suitecrm/marketing-suitecrm-app.dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ hashFiles(matrix.dockerfile) }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --load \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache \
            -t ${{ matrix.name }}:build \
            -f ${{ matrix.dockerfile }} .
  push-images:
    needs: [build-images, setup-acr-infra]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive 
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Enable Corepack (Yarn 4+)
        run: corepack enable
      
      - name: Login to Azure Container Registry
        run: |
          pulumi stack output acrPasswordOut -s setup-acr-infra | \
          docker login \
            "$(pulumi stack output acrUrlOut -s setup-acr-infra)" \
            -u "$(pulumi stack output acrUsernameOut -s setup-acr-infra)" \
            --password-stdin

      - name: Tag and push Docker images
        run: |
          acrUrlOut=$(pulumi stack output acrUrlOut -s setup-acr-infra)
          docker tag marketing-nginx:build $acrUrlOut/marketing-nginx:latest
          docker tag marketing-mautic-app:build $acrUrlOut/marketing-mautic-app:latest
          docker tag marketing-strapi-app:build $acrUrlOut/marketing-strapi-app:latest
          docker tag marketing-suitecrm-app:build $acrUrlOut/marketing-suitecrm-app:latest
          docker push $acrUrlOut/marketing-nginx:latest
          docker push $acrUrlOut/marketing-mautic-app:latest
          docker push $acrUrlOut/marketing-strapi-app:latest
          docker push $acrUrlOut/marketing-suitecrm-app:latest
