name: Deploy 
on:
  push:
    branches:
      - master
jobs:
  pulumi-up:
    environment: pulumi_environments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ["esc"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: ./azure-deploy/package.json
          cache-dependency-path: ./azure-deploy/package-lock.json

      - run: npm install
        working-directory: ./azure-deploy

      - name: Set stack variables
        run: |
          FULL_STACK="${{ vars[matrix.stack] }}"
          TRIMMED_STACK="${FULL_STACK#*/}"
          echo "TRIMMED_STACK=${TRIMMED_STACK}" >> $GITHUB_ENV
          echo "FULL_STACK=${FULL_STACK}" >> $GITHUB_ENV

      - name: Create Pulumi configuration file
        run: |
          mkdir -p ./azure-deploy/config
          cat <<EOF > ./azure-deploy/config/Pulumi.${TRIMMED_STACK}.yaml
          environment:
            - ${TRIMMED_STACK}
          EOF

      - name: Set up Pulumi
        uses: pulumi/actions@v6
        with: 
          pulumi-version: 3.158.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install Pulumi ESC CLI
        uses: pulumi/esc-action@v1
        with:
          environment: ajwtech/${FULL_STACK}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Run Pulumi inside ESC environment
        working-directory: ./azure-deploy
        run: |
          esc run ajwtech/${{ vars[matrix.stack] }} -- bash -c '
            pulumi install && \
            pulumi stack select "$1" && \
            pulumi up --yes
          ' dummy "${TRIMMED_STACK}"

      - name: Get Pulumi stack outputs
        id: pulumi
        run: | 
          echo "file_share_name=$(pulumi stack output devStrapiAppFilesStorage)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(pulumi stack output storageAccount.name)" >> $GITHUB_OUTPUT
          echo "resourceGroupName=$(pulumi stack output resourceGroup.name)" >> $GITHUB_OUTPUT

      - name: Get storage key
        id: get-storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ steps.pulumi.outputs.resourceGroupName }} \
            --account-name ${{ steps.pulumi.outputs.storage_account_name }} \
            --query "[0].value" --output tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "storage_key=$STORAGE_KEY" >> $GITHUB_OUTPUT

    outputs:
      file_share_name: ${{ steps.pulumi.outputs.fileShareName  }}
      storage_account_name: ${{ steps.pulumi.outputs.storage_account_name }}
      resourceGroupName: ${{ steps.pulumi.outputs.resourceGroupName }}
      storage_key: ${{ steps.get-storage-key.outputs.storage_key }}
  
  sync-files:
    runs-on: ubuntu-latest
    needs: pulumi-up
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Strapi files to Azure File Share
        run: |
          upload() {
            az storage file upload-batch \
              --account-name "$1" \
              --account-key "$2" \
              --source "$3" \
              --destination "$4" \
              --destination-path "$5" 
          } 
            
          ACCOUNT_NAME="${{ needs.pulumi-up.outputs.storage_account_name }}"
          ACCOUNT_KEY="${{ needs.pulumi-up.outputs.storage_key }}"
          SHARE_NAME="${{ needs.pulumi-up.outputs.file_share_name }}"

          upload "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./src" "$SHARE_NAME" "app/src"
          upload "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./config" "$SHARE_NAME" "app/config"
          upload "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./public/uploads" "$SHARE_NAME" "uploads"