name: Deploy
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - master
jobs:
  
  setup-acr-infra:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable Corepack (Yarn 4+)
        run: corepack enable
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable
        working-directory: .
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Run Pulumi Automation API for ACR infra
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-acr-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          # Stack name: organization/environment/setup-acr-infra
          ORG=$(echo "$ENV_ESC" | awk -F'/' '{print $1}')
          PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $2}')
          ENV=$(echo "$ENV_ESC" | awk -F'/' '{print $3}')
          STACK_NAME="$ORG/$ENV/setup-acr-infra"
          echo "Using stack: $STACK_NAME"
          npx ts-node index.ts --stack "$STACK_NAME"
  setup-infra:
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:js-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable Corepack (Yarn 4+)
        run: corepack enable
      - uses: actions/cache@v3
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install Node.js dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Run Pulumi Automation API for infra
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          ORG=$(echo "$ENV_ESC" | awk -F'/' '{print $1}')
          PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $2}')
          ENV=$(echo "$ENV_ESC" | awk -F'/' '{print $3}')
          STACK_NAME="$ORG/$ENV/setup-infra"
          echo "Using stack: $STACK_NAME"
          npx ts-node index.ts --stack "$STACK_NAME"

