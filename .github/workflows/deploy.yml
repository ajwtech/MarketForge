name: Deploy
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_setup_acr_infra:
        description: 'run setup-acr-infra job'
        required: false
        default: false
        type: boolean
      run_setup_infra:
        description: 'run setup-infra job'
        required: false
        default: false
        type: boolean
      run_build_and_push_images:
        description: 'run build-and-push-images job'
        required: false
        default: false
        type: boolean
      run_setup_apps:
        description: 'run setup-apps job'
        required: false
        default: false
        type: boolean

jobs:
  setup-acr-infra:
    if: github.event_name == 'push' || github.event.inputs.run_setup_acr_infra == true
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - name: Update to latest code
        run: |
          # Add current workspace as safe directory
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global --add safe.directory .
          # Check if we have a git repository, if not, initialize it
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          fi
          # Fetch and checkout the latest code
          git fetch origin ${GITHUB_REF#refs/heads/}
          git checkout ${GITHUB_REF#refs/heads/}
          git pull origin ${GITHUB_REF#refs/heads/}
      
      - name: Copy pre-built dependencies
        run: |
          # Copy pre-built node_modules from container to workspace
          cp -r /ci-workspace/node_modules ./
          # Copy yarn cache and config if they exist
          cp -r /ci-workspace/.yarn ./ 2>/dev/null || true
          ls -la node_modules/ | head -10  # Debug: show what was copied
      
      - name: Run Pulumi Automation API for ACR infra and export outputs
        id: pulumi-acr
        working-directory: ./azure-deploy
        env:
          PULUMI_JOB: setup-acr-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          yarn ts-node index.ts
      - name: Run Pulumi Automation API for infra
        working-directory: ./azure-deploy
        env:
          PULUMI_JOB: setup-infra
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          yarn ts-node index.ts
  build-and-push-images:
    if: github.event_name == 'push' || github.event.inputs.run_build_and_push_images == true
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
        name: [marketing-nginx, marketing-mautic-app, marketing-strapi-app, marketing-suitecrm-app]
        include:
          - name: marketing-nginx
            dockerfile: mautic/marketing-nginx.dockerfile
          - name: marketing-mautic-app
            dockerfile: mautic/marketing-mautic-app.dockerfile
          - name: marketing-strapi-app
            dockerfile: launchpad/Dockerfile.prod
          - name: marketing-suitecrm-app
            dockerfile: suitecrm/marketing-suitecrm-app.dockerfile
    env:
      ENV_ESC: ${{ vars.ESC }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ hashFiles(matrix.dockerfile) }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Compute build hash for image
        id: build_hash
        run: |
          DOCKERFILE_PATH="${{ matrix.dockerfile }}"
          CONTEXT_DIR=$(dirname "$DOCKERFILE_PATH")
          HASH=$(find "$CONTEXT_DIR" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "build_hash=$HASH" >> $GITHUB_OUTPUT
      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" \
            -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Login to Azure Container Registry
        run: |
          ORG_PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $1 "/" $2}')
          ACR_STACK_NAME="setup-acr-infra"
          FULL_STACK="$ORG_PROJECT/$ACR_STACK_NAME"
          pulumi stack output acrPasswordOut --show-secrets -s "$FULL_STACK" | \
          docker login \
            "$(pulumi stack output registryUrlOut -s "$FULL_STACK")" \
            -u "$(pulumi stack output acrUsernameOut -s "$FULL_STACK")" \
            --password-stdin

      - name: Build and push Docker image (if not present)
        run: |
          BUILD_HASH=${{ steps.build_hash.outputs.build_hash }}
          ORG_PROJECT=$(echo "$ENV_ESC" | awk -F'/' '{print $1 "/" $2}')
          ACR_STACK_NAME="setup-acr-infra"
          FULL_STACK="$ORG_PROJECT/$ACR_STACK_NAME"
          acrUrlOut=$(pulumi stack output registryUrlOut -s "$FULL_STACK")
          ACR_NAME=$(echo "$acrUrlOut" | awk -F'.' '{print $1}')
          repo="$acrUrlOut/${{ matrix.name }}"
          DIGEST_FILE="azure-deploy/sha-${{ matrix.name }}.txt"
          IMAGE_EXISTS=0
          # Use az acr manifest list-metadata to check if the image with this hash exists in ACR (replace deprecated show-manifests)
          if az acr manifest list-metadata --name "$ACR_NAME" --repository "${{ matrix.name }}" --query "[?tags[?@=='$BUILD_HASH']].digest" -o tsv | grep -q .; then
            IMAGE_EXISTS=1
          fi
          # Check if digest file exists and matches current build hash
          if [ -f "$DIGEST_FILE" ] && grep -q "$BUILD_HASH" "$DIGEST_FILE" && [ "$IMAGE_EXISTS" = "1" ]; then
            echo "$repo:$BUILD_HASH already built and pushed (digest file and ACR match), skipping build and push."
          else
            echo "Building and pushing $repo:$BUILD_HASH (digest file or ACR missing or outdated)"
            docker buildx create --use
            docker buildx build \
              --push \
              --cache-from=type=local,src=/tmp/.buildx-cache \
              --cache-to=type=local,dest=/tmp/.buildx-cache \
              -t $repo:$BUILD_HASH \
              -t $repo:latest \
              -f ${{ matrix.dockerfile }} .
            # Write the new digest/hash to the file for future runs
            echo "$BUILD_HASH" > "$DIGEST_FILE"
          fi
  setup-apps:
    if: github.event_name == 'push' || github.event.inputs.run_setup_apps == true
    needs: [build-and-push-images]
    runs-on: ubuntu-latest
    container: ghcr.io/ajwtech/marketforge-ci:latest
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - name: Update to latest code
        run: |
          # Add current workspace as safe directory
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global --add safe.directory .
          # Check if we have a git repository, if not, initialize it
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          fi
          # Fetch and checkout the latest code
          git fetch origin ${GITHUB_REF#refs/heads/}
          git checkout ${GITHUB_REF#refs/heads/}
          git pull origin ${GITHUB_REF#refs/heads/}
      
      - name: Copy pre-built dependencies
        run: |
          # Copy pre-built node_modules from container to workspace
          cp -r /ci-workspace/node_modules ./
          # Copy yarn cache and config if they exist
          cp -r /ci-workspace/.yarn ./ 2>/dev/null || true
      
      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" \
            -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Run Pulumi Automation API for apps
        id: pulumi-apps
        working-directory: ./azure-deploy
        env:
          PULUMI_JOB: setup-apps
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          yarn ts-node index.ts
      - name: Run Pulumi Automation API for certs
        id: pulumi-certs
        working-directory: ./azure-deploy
        env:
          PULUMI_JOB: setup-certs
          ENV_ESC: ${{ matrix.env_esc }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          yarn ts-node index.ts

