name: Deploy 
on:
  push:
    branches:
      - master
jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - name: marketing-strapi-app
            dockerfile: Dockerfile.prod
            context: launchpad/strapi
            cache: /tmp/.buildx-cache-strapi
          - name: marketing-nginx
            dockerfile: marketing-nginx.dockerfile
            context: mautic
            cache: /tmp/.buildx-cache-nginx
          - name: marketing-mautic-app
            dockerfile: marketing-mautic-app.dockerfile
            context: mautic
            cache: /tmp/.buildx-cache-mautic
          - name: marketing-suitecrm-app
            dockerfile: marketing-suitecrm-app.dockerfile
            context: suitecrm
            cache: /tmp/.buildx-cache-suitecrm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Copy SuiteCRM-Core into mautic/suitecrm context (for nginx build)
        if: matrix.build.name == 'marketing-nginx'
        run: |
          mkdir -p mautic/suitecrm
          rm -rf mautic/suitecrm/SuiteCRM-Core
          cp -a suitecrm/SuiteCRM-Core mautic/suitecrm/SuiteCRM-Core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: ${{ matrix.build.cache }}
          key: ${{ runner.os }}-buildx-${{ matrix.build.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.build.name }}-

      - name: Build ${{ matrix.build.name }} image with cache
        run: |
          docker buildx build \
            --cache-from=type=local,src=${{ matrix.build.cache }} \
            --cache-to=type=local,dest=${{ matrix.build.cache }}-new \
            -f ${{ matrix.build.dockerfile }} \
            -t ${{ matrix.build.name }}:latest .
          rm -rf ${{ matrix.build.cache }}
          mv ${{ matrix.build.cache }}-new ${{ matrix.build.cache }}
        working-directory: ${{ matrix.build.context }}

  pulumi-up:
    needs: build-images
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      ENV_ESC: ${{ vars.ESC }}
    strategy:
      matrix:
        stack: [$ENV_ESC]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./azure-deploy/package.json

      - name: Set stack variables
        run: |
          if [ -n "${{ env.ESC }}" ]; then
            FULL_STACK="${{ env.ESC }}"
            echo "Using matrix stack: ${FULL_STACK}"
          elif [ -n "${{ matrix.stack }}" ]; then
            FULL_STACK=${{ matrix.stack }}
            echo "Using matrix stack: ${FULL_STACK}"
          else
            FULL_STACK=""
            echo "No stack value provided. create a repo variable named '${{ matrix.stack }}' and list the fully qualified environments e.g. 'org/project/environment'"
            echo "You can also set the environment variable ESC in the workflow file however you can only use one environment at a time."
            echo "::error file={name},line={line},endLine={endLine},title={title}::{message}"
            exit 1
          fi
          TRIMMED_STACK="${FULL_STACK##*/}"
          ESC_ENVIRONMENT="${FULL_STACK#*/}"
          echo "TRIMMED_STACK=${TRIMMED_STACK}" >> $GITHUB_ENV
          echo "FULL_STACK=${FULL_STACK}" >> $GITHUB_ENV
          echo "ESC_ENVIRONMENT=${ESC_ENVIRONMENT}" >> $GITHUB_ENV
          echo "TRIMMED_STACK: ${TRIMMED_STACK}"
          echo "FULL_STACK: ${FULL_STACK}" 
          echo "ESC_ENVIRONMENT: ${ESC_ENVIRONMENT}"
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ./azure-deploy/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('./azure-deploy/.yarn/install-state.gz') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ hashFiles('./azure-deploy/.yarn/install-state.gz') }}

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.9.1
        run: corepack prepare yarn@4.9.1 --activate
      - name: Set ARM environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "PULUMI_ACCESS_TOKEN=${{ secrets.PULUMI_ACCESS_TOKEN }}" >> $GITHUB_ENV
          
      - name: Create Pulumi configuration file
        working-directory: ./azure-deploy
        run: |
          mkdir -p ./config
          cat <<EOF > ./config/Pulumi.${TRIMMED_STACK}.yaml
            environment: 
              - ${ESC_ENVIRONMENT}
          EOF

      - name: Verify Pulumi configuration file
        working-directory: ./azure-deploy
        run: |
          echo "Pulumi configuration file content:"
          cat ./config/Pulumi.${TRIMMED_STACK}.yaml

      - name: Set up Pulumi
        uses: pulumi/actions@v6
        with: 
          pulumi-version: 3.165.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install Pulumi ESC CLI
        uses: pulumi/esc-action@v1
        with:
          environment: ${{ env.FULL_STACK }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
             
      - name: Install Azure CLI
        uses: pietrobolcato/install-azure-cli-action@main

      - name: Install Dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy

      - name: Run Pulumi inside ESC environment
        working-directory: ./azure-deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          esc run ${FULL_STACK} -- bash -c "
            pulumi stack select ${TRIMMED_STACK} &&
            pulumi up --yes
            "

