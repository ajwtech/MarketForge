name: Deploy Strapi and Upload Files
on:
  push:
    branches:
      - master
jobs:
  pulumi-up:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Set up Pulumi"
        uses: pulumi/actions@v4
        with:
          command: up
          stack-name: esc://marketforge
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Get Pulumi stack outputs
        id: pulumi
        run: | 
          echo "file_share_name=$(pulumi stack output devStrapiAppFilesStorage)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(pulumi stack output storageAccount.name)" >> $GITHUB_OUTPUT
          echo "resourceGroupName=$(pulumi stack output resourceGroup.name)" >> $GITHUB_OUTPUT
      - name: Get storage key
        id: get-storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ steps.pulumi.outputs.AZURE_RESOURCE_GROUP }} \
            --account-name ${{ steps.pulumi.outputs.storage_account_name }} \
            --query "[0].value" --output tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "storage_key=$STORAGE_KEY" >> $GITHUB_OUTPUT

    outputs:
      file_share_name: ${{ steps.pulumi.outputs.fileShareName  }}
      storage_account_name: ${{ steps.pulumi.outputs.storage_account_name }}
      AZURE_RESOURCE_GROUP: ${{ steps.pulumi.outputs.resourceGroupName }}
      storage_key: ${{ steps.get-storage-key.outputs.storage_key }}
  
  sync-files:
    runs-on: ubuntu-latest
    needs: pulumi-up
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload Strapi files to Azure File Share
        run: |
          az storage file upload-batch \
          --account-name ${{ needs.pulumi-up.outputs.storage_account_name }} \
          --account-key ${{ needs.pulumi-up.outputs.storage_key }} \
          --source ./src \
          --destination ${{ needs.pulumi-up.outputs.file_share_name }} \
          --destination-path app/src

          az storage file upload-batch \
          --account-name ${{ needs.pulumi-up.outputs.storage_account_name }} \
          --account-key ${{ needs.pulumi-up.outputs.storage_key }} \
          --source ./config \
          --destination ${{ needs.pulumi-up.outputs.file_share_name }} \
          --destination-path app/config

          az storage file upload-batch \
          --account-name ${{ needs.pulumi-up.outputs.storage_account_name }} \
          --account-key ${{ needs.pulumi-up.outputs.storage_key }} \
          --source ./public/uploads \
          --destination ${{ needs.pulumi-up.outputs.file_share_name }} \
          --destination-path uploads