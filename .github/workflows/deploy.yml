name: Deploy
on:
  push:
    branches:
      - master
jobs:
  pulumi-infra:
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      ENV_ESC: ${{ vars.ESC }}
    outputs:
      ACR_USERNAME: ${{ steps.acr-creds.outputs.ACR_USERNAME }}
      ACR_PASSWORD: ${{ steps.acr-creds.outputs.ACR_PASSWORD }}
      ACR_URL: ${{ steps.acr-creds.outputs.ACR_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./azure-deploy/package.json
      - name: Set stack variables
        run: |
          FULL_STACK="${{ vars.ESC }}"
          TRIMMED_STACK="${FULL_STACK##*/}"
          ESC_ENVIRONMENT="${FULL_STACK#*/}"
          echo "TRIMMED_STACK=${TRIMMED_STACK}" >> $GITHUB_ENV
          echo "FULL_STACK=${FULL_STACK}" >> $GITHUB_ENV
          echo "ESC_ENVIRONMENT=${ESC_ENVIRONMENT}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
      - name: Enable Corepack
        run: corepack enable
      - name: Activate Yarn 4.9.1 (with retry)
        run: |
          for i in 1 2 3 4 5; do
            corepack prepare yarn@4.9.1 --activate && break || sleep 10
          done
      - name: Set ARM environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "PULUMI_ACCESS_TOKEN=${{ secrets.PULUMI_ACCESS_TOKEN }}" >> $GITHUB_ENV
      - name: Set up Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.165.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Install Azure CLI
        uses: pietrobolcato/install-azure-cli-action@main
      - name: Install Dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy
      - name: Run Pulumi to create infra (ACR, storage, etc)
        working-directory: ./azure-deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack select ${TRIMMED_STACK}
          pulumi up --yes --target "infrastructure/registries/acrRegistry.ts"
      - name: Export ACR credentials for next job
        id: acr-creds
        run: |
          echo "ACR_USERNAME=$(pulumi stack output acrUsername)" >> $GITHUB_OUTPUT
          echo "ACR_PASSWORD=$(pulumi stack output acrPassword)" >> $GITHUB_OUTPUT
          echo "ACR_URL=$(pulumi stack output registryUrl)" >> $GITHUB_OUTPUT

  build-and-push-images:
    needs: pulumi-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Login to Azure Container Registry
        run: echo ${{ needs.pulumi-infra.outputs.ACR_PASSWORD }} | docker login ${{ needs.pulumi-infra.outputs.ACR_URL }} -u ${{ needs.pulumi-infra.outputs.ACR_USERNAME }} --password-stdin
      - name: Build and push Docker images
        run: |
          docker buildx create --use
          docker buildx build --push -t ${{ needs.pulumi-infra.outputs.ACR_URL }}/marketing-nginx:latest -f mautic/marketing-nginx.dockerfile mautic
          docker buildx build --push -t ${{ needs.pulumi-infra.outputs.ACR_URL }}/marketing-mautic-app:latest -f mautic/marketing-mautic-app.dockerfile mautic
          docker buildx build --push -t ${{ needs.pulumi-infra.outputs.ACR_URL }}/marketing-strapi-app:latest -f launchpad/Dockerfile.prod launchpad
          docker buildx build --push -t ${{ needs.pulumi-infra.outputs.ACR_URL }}/marketing-suitecrm-app:latest -f suitecrm/marketing-suitecrm-app.dockerfile suitecrm

  pulumi-apps:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    env:
      ENV_ESC: ${{ vars.ESC }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: ./azure-deploy/package.json
      - name: Set stack variables
        run: |
          FULL_STACK="${{ vars.ESC }}"
          TRIMMED_STACK="${FULL_STACK##*/}"
          ESC_ENVIRONMENT="${FULL_STACK#*/}"
          echo "TRIMMED_STACK=${TRIMMED_STACK}" >> $GITHUB_ENV
          echo "FULL_STACK=${FULL_STACK}" >> $GITHUB_ENV
          echo "ESC_ENVIRONMENT=${ESC_ENVIRONMENT}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
      - name: Enable Corepack
        run: corepack enable
      - name: Activate Yarn 4.9.1 (with retry)
        run: |
          for i in 1 2 3 4 5; do
            corepack prepare yarn@4.9.1 --activate && break || sleep 10
          done
      - name: Set ARM environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "PULUMI_ACCESS_TOKEN=${{ secrets.PULUMI_ACCESS_TOKEN }}" >> $GITHUB_ENV
      - name: Set up Pulumi
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.165.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Install Azure CLI
        uses: pietrobolcato/install-azure-cli-action@main
      - name: Install Dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy
      - name: Run Pulumi to deploy container apps
        working-directory: ./azure-deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack select ${TRIMMED_STACK}
          pulumi up --yes --target "infrastructure/containerApps/mauticNginx.ts" --target "infrastructure/containerApps/strapiApp.ts" --target "infrastructure/containerApps/suiteCrmApp.ts"

