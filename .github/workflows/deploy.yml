name: Deploy
on:
  push:
    branches:
      - master
jobs:
  setup-environment:
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    strategy:
      matrix:
        env_esc: '${{ fromJson(vars.ESC) }}'
    env:
      ENV_ESC: ${{ matrix.env_esc }}
    outputs:
      FULL_STACK: ${{ steps.set-stack-vars.outputs.FULL_STACK }}
      TRIMMED_STACK: ${{ steps.set-stack-vars.outputs.TRIMMED_STACK }}
      ESC_ENVIRONMENT: ${{ steps.set-stack-vars.outputs.ESC_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ./azure-deploy/package.json
      - name: Enable Corepack
        run: corepack enable
      - name: Activate Yarn 4.9.1 (with retry)
        run: |
          for i in 1 2 3 4 5; do
            corepack prepare yarn@4.9.1 --activate && break || sleep 10
          done
      - name: Set stack variables
        id: set-stack-vars
        run: |
          echo "FULL_STACK=${ENV_ESC}"
          echo "FULL_STACK=${ENV_ESC}" >> $GITHUB_ENV
          trimmed_stack="${ENV_ESC##*/}"
          esc_environment="${ENV_ESC#*/}"
          echo "TRIMMED_STACK=$trimmed_stack" >> $GITHUB_ENV
          echo "ESC_ENVIRONMENT=$esc_environment" >> $GITHUB_ENV
          echo "FULL_STACK=$ENV_ESC" >> $GITHUB_OUTPUT
          echo "TRIMMED_STACK=$trimmed_stack" >> $GITHUB_OUTPUT
          echo "ESC_ENVIRONMENT=$esc_environment" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: yarn install --immutable
        working-directory: ./azure-deploy

  setup-acr-infra:
    needs: setup-environment
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
    outputs:
      ACR_USERNAME: ${{ steps.acr-creds.outputs.ACR_USERNAME }}
      ACR_PASSWORD: ${{ steps.acr-creds.outputs.ACR_PASSWORD }}
      ACR_URL: ${{ steps.acr-creds.outputs.ACR_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set ESC and Pulumi OIDC env vars
        id: set-esc-vars
        run: |
          echo "ESC_ACTION_ENVIRONMENT=$ENV_ESC" >> $GITHUB_ENV
          ORG="${ENV_ESC%%/*}"
          echo "organization=$ORG" >> $GITHUB_OUTPUT
      - uses: pulumi/esc-action@v1
      - uses: pulumi/auth-actions@v1
        with:
          organization: ${{ steps.set-esc-vars.outputs.organization }}
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - name: Run Pulumi for ACR infra only
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-acr-infra
        run: |
          pulumi up --yes
      - name: Export ACR credentials for next job
        id: acr-creds
        run: |
          echo "ACR_USERNAME=$(pulumi stack output acrUsernameOut)" >> $GITHUB_OUTPUT
          echo "ACR_PASSWORD=$(pulumi stack output acrPasswordOut)" >> $GITHUB_OUTPUT
          echo "ACR_URL=$(pulumi stack output registryUrlOut)" >> $GITHUB_OUTPUT

  setup-infra:
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set ESC and Pulumi OIDC env vars
        id: set-esc-vars
        run: |
          echo "ESC_ACTION_ENVIRONMENT=$ENV_ESC" >> $GITHUB_ENV
          ORG="${ENV_ESC%%/*}"
          echo "organization=$ORG" >> $GITHUB_OUTPUT
      - uses: pulumi/esc-action@v1
      - uses: pulumi/auth-actions@v1
        with:
          organization: ${{ steps.set-esc-vars.outputs.organization }}
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - name: Run Pulumi for infra (no apps)
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-infra
        run: |
          pulumi up --yes

  build-and-push-images:
    needs: setup-acr-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Login to Azure Container Registry
        run: echo ${{ needs.setup-acr-infra.outputs.ACR_PASSWORD }} | docker login ${{ needs.setup-acr-infra.outputs.ACR_URL }} -u ${{ needs.setup-acr-infra.outputs.ACR_USERNAME }} --password-stdin
      - name: Build and push Docker images
        run: |
          docker buildx create --use
          docker buildx build --push -t ${{ needs.setup-acr-infra.outputs.ACR_URL }}/marketing-nginx:latest -f mautic/marketing-nginx.dockerfile mautic
          docker buildx build --push -t ${{ needs.setup-acr-infra.outputs.ACR_URL }}/marketing-mautic-app:latest -f mautic/marketing-mautic-app.dockerfile mautic
          docker buildx build --push -t ${{ needs.setup-acr-infra.outputs.ACR_URL }}/marketing-strapi-app:latest -f launchpad/Dockerfile.prod launchpad
          docker buildx build --push -t ${{ needs.setup-acr-infra.outputs.ACR_URL }}/marketing-suitecrm-app:latest -f suitecrm/marketing-suitecrm-app.dockerfile suitecrm

  setup-apps:
    needs: [setup-infra, build-and-push-images]
    runs-on: ubuntu-latest
    environment: pulumi_environments
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    strategy:
      matrix:
        env_esc: ${{ fromJson(vars.ESC) }}
    env:
      ENV_ESC: ${{ matrix.env_esc }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set ESC and Pulumi OIDC vars
        id: set-esc-vars
        run: |
          echo "ESC_ACTION_ENVIRONMENT=$ENV_ESC" >> $GITHUB_ENV
          ORG="${ENV_ESC%%/*}"
          echo "organization=$ORG" >> $GITHUB_OUTPUT
      - uses: pulumi/esc-action@v1
      - uses: pulumi/auth-actions@v1
        with:
          organization: ${{ steps.set-esc-vars.outputs.organization }}
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - name: Run Pulumi for apps only
        working-directory: ./azure-deploy
        env:
          GITHUB_JOB: setup-apps
        run: |
          pulumi up --yes

