name: Deploy 
on:
  push:
    branches:
      - master
jobs:
  pulumi-up:
    environment: pulumi_environments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ["esc"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ./azure-deploy/package.json
          
      - name: Cache Node Modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./azure-deploy

      - name: Set stack variables
        run: |
          if [ -n "${{ env.ESC }}" ]; then
            # When running locally with act, or when ESC is not provided,
            # use the env.ESC value
            FULL_STACK="${{ env.ESC }}"
            echo "Using ESC value: ${FULL_STACK}"
          else
            FULL_STACK="${{ vars[matrix.stack]}}"
            echo "Using matrix stack: ${FULL_STACK}"
          fi
          TRIMMED_STACK="${FULL_STACK##*/}"
          ESC_ENVIRONMENT="${FULL_STACK#*/}"
          echo "TRIMMED_STACK=${TRIMMED_STACK}" >> $GITHUB_ENV
          echo "FULL_STACK=${FULL_STACK}" >> $GITHUB_ENV
          echo "ESC_ENVIRONMENT=${ESC_ENVIRONMENT}" >> $GITHUB_ENV
          echo "TRIMMED_STACK: ${TRIMMED_STACK}"
          echo "FULL_STACK: ${FULL_STACK}" 
          echo "ESC_ENVIRONMENT: ${ESC_ENVIRONMENT}"
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          
      - name: Set ARM environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          
      - name: Create Pulumi configuration file
        working-directory: ./azure-deploy
        run: |
          mkdir -p ./config
          cat <<EOF > ./config/Pulumi.${TRIMMED_STACK}.yaml
            environment: 
              - ${ESC_ENVIRONMENT}
          EOF

      - name: Verify Pulumi configuration file
        working-directory: ./azure-deploy
        run: |
          echo "Pulumi configuration file content:"
          cat ./config/Pulumi.${TRIMMED_STACK}.yaml

      - name: Set up Pulumi
        uses: pulumi/actions@v6
        with: 
          pulumi-version: 3.161.0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Install Pulumi ESC CLI
        uses: pulumi/esc-action@v1
        with:
          environment: ${{ env.FULL_STACK }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Run Pulumi inside ESC environment
        working-directory: ./azure-deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          esc run ${FULL_STACK} -- bash -c "
            pulumi stack select ${TRIMMED_STACK} &&
            pulumi up --yes
            "

      - name: Get Pulumi stack outputs
        id: pulumi
        working-directory: ./azure-deploy
        run: | 
          echo "file_share_name=$(pulumi stack output frontendStorageName)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(pulumi stack output storageAccountName)" >> $GITHUB_OUTPUT
          echo "resourceGroupName=$(pulumi stack output resourceGroupName)" >> $GITHUB_OUTPUT
          
      - name: Get storage key
        id: get-storage-key
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group ${{ steps.pulumi.outputs.resourceGroupName }} \
            --account-name ${{ steps.pulumi.outputs.storage_account_name }} \
            --query "[0].value" --output tsv)
          echo "::add-mask::$STORAGE_KEY"
          echo "storage_key=$STORAGE_KEY" >> $GITHUB_OUTPUT

    outputs:
      file_share_name: ${{ steps.pulumi.outputs.file_share_name  }}
      storage_account_name: ${{ steps.pulumi.outputs.storage_account_name }}
      resourceGroupName: ${{ steps.pulumi.outputs.resourceGroupName }}
      storage_key: ${{ steps.get-storage-key.outputs.storage_key }}
  
  sync-files:
    runs-on: ubuntu-latest
    needs: pulumi-up
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Adding Azure CLI cache to avoid repeated installations
      - name: Azure CLI Cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.azure/cli
          key: ${{ runner.os }}-az-cli-${{ hashFiles('**/.github/workflows/deploy.yml') }}
          
      - name: Install Azure CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Upload Strapi files to Azure File Share
        run: |
          # Using parallel uploads for improved performance
          upload_parallel() {
            if [ -d "$3" ]; then
              echo "Uploading from $3 to $4/$5"
              # Use azcopy for faster transfers with parallelism
              az storage file upload-batch \
                --account-name "$1" \
                --account-key "$2" \
                --source "$3" \
                --destination "$4" \
                --destination-path "$5" \
                --max-connections 10
            else
              echo "Source directory $3 does not exist. Skipping."
              ls -la $(dirname "$3")
            fi
          }
            
          ACCOUNT_NAME="${{ needs.pulumi-up.outputs.storage_account_name }}"
          ACCOUNT_KEY="${{ needs.pulumi-up.outputs.storage_key }}"
          SHARE_NAME="${{ needs.pulumi-up.outputs.file_share_name }}"
          
          # Check current directory
          echo "Current working directory:"
          pwd
          ls -la
          
          # Use parallel uploads for better performance
          upload_parallel "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./strapi/src" "$SHARE_NAME" "app/src"
          upload_parallel "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./strapi/config" "$SHARE_NAME" "app/config"
          upload_parallel "$ACCOUNT_NAME" "$ACCOUNT_KEY" "./strapi/public/uploads" "$SHARE_NAME" "uploads"