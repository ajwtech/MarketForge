# Centralized logging configuration

# Define variables from environment variables
map ${NGINX_LOGGING_ENABLED} $logging_enabled {
    "on"    "on";
    "off"   "off";
    default "off";
}

map ${NGINX_ACCESS_LOG_ENABLED} $access_log_override {
    "on"    "on";
    "off"   "off";
    default "";  # Empty default to fall back to $logging_enabled
}

map ${NGINX_ERROR_LOG_ENABLED} $error_log_override {
    "on"    "on";
    "off"   "off";
    default "";  # Empty default to fall back to $logging_enabled
}

map ${NGINX_DEBUG_LOG_ENABLED} $debug_log_override {
    "on"    "on";
    "off"   "off";
    "debug" "debug";
    default "";  # Empty default to fall back to $logging_enabled
}

map ${NGINX_STATIC_LOG_ENABLED} $static_log_override {
    "on"    "on";
    "off"   "off";
    default "";  # Empty default to fall back to $logging_enabled
}

# Add an explicit error_log_level definition
map $debug_log_final $error_log_level {
    "on"    "debug";
    default "error";
}

# Log format definition
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" "$gzip_ratio" '
                'rt=$request_time uct="$upstream_connect_time" '
                'uht="$upstream_header_time" urt="$upstream_response_time" '
                'us="$upstream_status"';

# Define derived log settings based on master switch and overrides
map $access_log_override $access_log_enabled {
    "on"    "on";
    "off"   "off";
    default $logging_enabled;
}

map $error_log_override $error_log_enabled {
    "on"    "on";
    "off"   "off";
    default $logging_enabled;
}

map $static_log_override $static_log_enabled {
    "on"    "on";
    "off"   "off";
    default "off";  # Static content logging is off by default, even if main logging is on
}

map $debug_log_override $debug_log_enabled {
    "on"    "on";
    "off"   "off";
    default $logging_enabled;  # Inherit from main switch
}

# Modify debug logging based on logging_enabled value
map $debug_log_enabled $debug_log_final {
    "debug"  "on";  # Special value to enable debug logs
    "full"   "on";  # Full logging enables everything
    "on"     "off"; # Regular "on" doesn't enable debug
    default  "off";  # Default for normal logging
}

# Common logging macros
map $access_log_enabled $access_log_path {
    "on"    "/var/log/nginx/access.log main";
    default off;
}

map $error_log_enabled $error_log_path {
    "on"    "/var/log/nginx/error.log";
    default off;
}

map $debug_log_enabled $debug_log_path {
    "on"    "/var/log/nginx/debug.log debug";
    default off;
}

# Service-specific log paths
map $access_log_enabled $mautic_access_log {
    "on"    "/var/log/nginx/mautic_access.log main";
    default off;
}

map $access_log_enabled $strapi_access_log {
    "on"    "/var/log/nginx/strapi_access.log main";
    default off;
}

map $access_log_enabled $suitecrm_access_log {
    "on"    "/var/log/nginx/suitecrm_access.log main";
    default off;
}

map $access_log_enabled $frontend_access_log {
    "on"    "/var/log/nginx/frontend_access.log main";
    default off;
}

map $error_log_enabled $mautic_error_log {
    "on"    "/var/log/nginx/mautic_error.log";
    default off;
}

map $error_log_enabled $strapi_error_log {
    "on"    "/var/log/nginx/strapi_error.log";
    default off;
}

map $error_log_enabled $suitecrm_error_log {
    "on"    "/var/log/nginx/suitecrm_error.log";
    default off;
}

map $error_log_enabled $frontend_error_log {
    "on"    "/var/log/nginx/frontend_error.log";
    default off;
}

# Update debug log paths to use debug_log_final
map $debug_log_final $mautic_debug_log {
    "on"    "/var/log/nginx/mautic_debug.log debug";
    default off;
}

map $debug_log_final $strapi_debug_log {
    "on"    "/var/log/nginx/strapi_debug.log debug";
    default off;
}

map $debug_log_final $suitecrm_debug_log {
    "on"    "/var/log/nginx/suitecrm_debug.log debug";
    default off;
}

map $static_log_enabled $static_access_log {
    "on"    "/var/log/nginx/static_access.log main";
    default off;
}

map $static_log_enabled $static_error_log {
    "on"    "/var/log/nginx/static_error.log";
    default off;
}
