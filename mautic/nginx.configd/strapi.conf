server {
    listen 80;
    server_name ~^cms\..*;
    client_max_body_size 200m;

    location / {
        proxy_pass http://strapiApp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # Explicitly set to HTTPS
        proxy_request_buffering off;   # stream request body to upstream
        proxy_buffering        off;    # stream responses (helps WS + SSE)
        proxy_read_timeout 3600s;  # Long timeout for stable WebSocket connection
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name ~^beta\..*;

    location / {
        proxy_pass http://betaFrontendApp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}