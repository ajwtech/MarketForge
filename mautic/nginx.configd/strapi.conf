server {
    listen 80;
    server_name dev.cms.*;

    location / {
        proxy_pass http://devStrapiApp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # Explicitly set to HTTPS
        proxy_read_timeout 3600s;  # Long timeout for stable WebSocket connection
    }

    # # WebSocket/HMR support for Vite admin UI
    # location /ws/ {
